<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">Python Journey — Scenic Escape</title>
  <desc id="desc">A peaceful scenic landscape with sunrise over layered mountains, a pine forest, and a reflective alpine lake.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#142c55"/>
      <stop offset=".52" stop-color="#e58f88"/>
      <stop offset="1" stop-color="#f6c89b"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
