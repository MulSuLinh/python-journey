<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">Python Journey — Learn by building</title>
  <desc id="desc">A modern dark navy banner with glowing teal and violet paths, Python-inspired code panels, and the learning loop Learn, Build, Test, Debug, Improve.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset=".55" stop-color="#101d3a"/>
      <stop offset="1" stop-color="#211a49"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39e6c2"/>
      <stop offset="1" stop-color="#8c7bff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#152746" stop-opacity=".96"/>
      <stop offset="1" stop-color="#101a31" stop-opacity=".92"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#4c6fff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#4c6fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#9bb8e8" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020611" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="1600" height="480" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="480" rx="28" fill="url(#grid)"/>
  <circle cx="1320" cy="80" r="380" fill="url(#aura)"/>
  <circle cx="130" cy="440" r="260" fill="url(#aura)"/>
  <path d="M0 390 C260 280 380 520 650 390 S1070 210 1600 300" fill="none" stroke="url(#glow)" stroke-opacity=".18" stroke-width="2"/>
  <path d="M0 420 C300 310 420 540 700 410 S1120 250 1600 340" fill="none" stroke="#5cebd0" stroke-opacity=".12" stroke-width="1.5"/>
  <g opacity=".8" fill="none" stroke="url(#glow)" stroke-width="2">
    <path d="M1180 42h90a16 16 0 0 1 16 16v20"/>
    <path d="M1450 382h-74a16 16 0 0 1-16-16v-20"/>
    <circle cx="1286" cy="78" r="4" fill="#39e6c2" stroke="none"/>
    <circle cx="1360" cy="346" r="4" fill="#8c7bff" stroke="none"/>
  </g>
  <g transform="translate(92 86)">
    <rect width="54" height="54" rx="16" fill="url(#glow)" filter="url(#softGlow)"/>
    <path d="M31 12c-8 0-12 4-12 12v5h13v4H13c-5 0-8 4-8 10v6c0 5 4 8 9 8h8v-8c0-6 4-10 10-10h8c5 0 8-4 8-9v-7c0-7-5-11-17-11Zm-7 10a3 3 0 1 1 0 6 3 3 0 0 1 0-6Z" fill="#081426"/>
    <path d="M25 42c0-5 4-8 9-8h8c6 0 9-4 9-9v-4c5 1 8 4 8 9v7c0 7-5 11-12 11H34v5H21v-3c0-4 1-6 4-8Z" fill="#081426" opacity=".82" transform="translate(-1 -1)"/>
  </g>
  <text x="166" y="121" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#9aadd0">A HANDS-ON PYTHON LEARNING PATH</text>
  <text x="88" y="218" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="800" letter-spacing="-2" fill="#f4f8ff">Python <tspan fill="url(#glow)">Journey</tspan></text>
  <text x="92" y="267" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="500" fill="#c1cee5">Từ dòng code đầu tiên đến project có thể kiểm chứng.</text>
  <g transform="translate(92 316)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">
    <rect width="114" height="42" rx="21" fill="#183b4b" stroke="#39e6c2" stroke-opacity=".45"/>
    <text x="57" y="26" text-anchor="middle" fill="#77f3d8">LEARN</text>
    <path d="M122 21h18" stroke="#7086ad" stroke-width="2" stroke-linecap="round"/><path d="m135 15 6 6-6 6" fill="none" stroke="#7086ad" stroke-width="2"/>
    <rect x="148" width="114" height="42" rx="21" fill="#1c3153" stroke="#6d9dff" stroke-opacity=".45"/>
    <text x="205" y="26" text-anchor="middle" fill="#a7c6ff">BUILD</text>
    <path d="M270 21h18" stroke="#7086ad" stroke-width="2" stroke-linecap="round"/><path d="m283 15 6 6-6 6" fill="none" stroke="#7086ad" stroke-width="2"/>
    <rect x="296" width="114" height="42" rx="21" fill="#29264f" stroke="#a58bff" stroke-opacity=".55"/>
    <text x="353" y="26" text-anchor="middle" fill="#c7b8ff">TEST</text>
    <path d="M418 21h18" stroke="#7086ad" stroke-width="2" stroke-linecap="round"/><path d="m431 15 6 6-6 6" fill="none" stroke="#7086ad" stroke-width="2"/>
    <rect x="444" width="114" height="42" rx="21" fill="#183b4b" stroke="#39e6c2" stroke-opacity=".45"/>
    <text x="501" y="26" text-anchor="middle" fill="#77f3d8">IMPROVE</text>
  </g>
  <g transform="translate(920 78)" filter="url(#shadow)">
    <rect width="570" height="322" rx="20" fill="url(#panel)" stroke="#8098c9" stroke-opacity=".3"/>
    <path d="M0 58H570" stroke="#8098c9" stroke-opacity=".22"/>
    <circle cx="28" cy="29" r="5" fill="#ff7185"/><circle cx="48" cy="29" r="5" fill="#ffc56f"/><circle cx="68" cy="29" r="5" fill="#48dfb3"/>
    <text x="96" y="34" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" fill="#8296b9">journey.py</text>
    <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18">
      <text x="28" y="98" fill="#7388ab">01</text><text x="66" y="98" fill="#c7a7ff">def</text><text x="111" y="98" fill="#8fe8d8"> learn</text><text x="179" y="98" fill="#e4ecfb">():</text>
      <text x="28" y="136" fill="#7388ab">02</text><text x="88" y="136" fill="#e4ecfb"> build_small_steps()</text>
      <text x="28" y="174" fill="#7388ab">03</text><text x="88" y="174" fill="#e4ecfb"> test_the_result()</text>
      <text x="28" y="212" fill="#7388ab">04</text><text x="88" y="212" fill="#e4ecfb"> debug_with_care()</text>
      <text x="28" y="250" fill="#7388ab">05</text><text x="88" y="250" fill="#e4ecfb"> return </text><text x="166" y="250" fill="#8fe8d8">"keep going"</text>
    </g>
    <rect x="28" y="273" width="514" height="30" rx="9" fill="#0b1528" stroke="#39e6c2" stroke-opacity=".25"/>
    <circle cx="45" cy="288" r="4" fill="#39e6c2" filter="url(#softGlow)"/>
    <text x="60" y="293" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" fill="#8cebd7">tests passed · progress saved · next step unlocked</text>
  </g>
  <text x="1508" y="444" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2" fill="#8194b8">15 WEEKS  ·  LEARN BY DOING</text>
</svg>